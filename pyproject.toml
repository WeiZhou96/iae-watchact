[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iae-watchact"
version = "1.0.0"
description = "Instance-anchored interaction evidence for WatchAct planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "Pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["iae*", "scripts*"]
